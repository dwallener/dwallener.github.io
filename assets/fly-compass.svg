<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">How a fly keeps track of its heading</title><desc id="desc">A landmark anchors heading at zero degrees. Turning right moves the activity bump to ninety degrees. After stopping in darkness the bump remains, with possible drift.</desc><rect width="1080" height="510" fill="#e9eee5"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#182a28"><text x="180" y="35" font-size="18" font-weight="bold">1. SEE A LANDMARK</text><text x="180" y="61" font-size="15">Set a reference heading</text><rect x="30" y="82" width="300" height="185" rx="10" fill="#f4f1e9"/><path d="M 65 120 l 16 -28 l 16 28 z" fill="#bd7d35"/><text x="125" y="110" font-size="13" fill="#52635e">landmark</text><g transform="translate(180,180) rotate(0)" stroke="#182a28" fill="none" stroke-width="2"><ellipse cx="-14" cy="4" rx="11" ry="24" transform="rotate(25)"/><ellipse cx="14" cy="4" rx="11" ry="24" transform="rotate(-25)"/><ellipse cy="5" rx="7" ry="23"/><circle cy="-23" r="8"/><path d="M 0 -35 v -18 m -5 7 l 5 -7 l 5 7"/></g><text x="180" y="251" font-size="14" fill="#52635e">Fly facing reference</text><circle cx="180.00" cy="307.00" r="9" fill="#e2a03d"/><circle cx="202.20" cy="311.41" r="9" fill="#cba86a"/><circle cx="221.01" cy="323.99" r="9" fill="#b8c9bf"/><circle cx="233.59" cy="342.80" r="9" fill="#b8c9bf"/><circle cx="238.00" cy="365.00" r="9" fill="#b8c9bf"/><circle cx="233.59" cy="387.20" r="9" fill="#b8c9bf"/><circle cx="221.01" cy="406.01" r="9" fill="#b8c9bf"/><circle cx="202.20" cy="418.59" r="9" fill="#b8c9bf"/><circle cx="180.00" cy="423.00" r="9" fill="#b8c9bf"/><circle cx="157.80" cy="418.59" r="9" fill="#b8c9bf"/><circle cx="138.99" cy="406.01" r="9" fill="#b8c9bf"/><circle cx="126.41" cy="387.20" r="9" fill="#b8c9bf"/><circle cx="122.00" cy="365.00" r="9" fill="#b8c9bf"/><circle cx="126.41" cy="342.80" r="9" fill="#b8c9bf"/><circle cx="138.99" cy="323.99" r="9" fill="#b8c9bf"/><circle cx="157.80" cy="311.41" r="9" fill="#cba86a"/><text x="180" y="361" font-size="15">Heading</text><text x="180" y="383" font-size="20" font-weight="bold">0°</text><text x="180" y="458" font-size="15">Activity bump anchors</text></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#182a28"><text x="540" y="35" font-size="18" font-weight="bold">2. TURN RIGHT</text><text x="540" y="61" font-size="15">Update heading by 90°</text><rect x="390" y="82" width="300" height="185" rx="10" fill="#f4f1e9"/><path d="M 425 120 l 16 -28 l 16 28 z" fill="#bd7d35"/><text x="485" y="110" font-size="13" fill="#52635e">landmark</text><g transform="translate(540,180) rotate(90)" stroke="#182a28" fill="none" stroke-width="2"><ellipse cx="-14" cy="4" rx="11" ry="24" transform="rotate(25)"/><ellipse cx="14" cy="4" rx="11" ry="24" transform="rotate(-25)"/><ellipse cy="5" rx="7" ry="23"/><circle cy="-23" r="8"/><path d="M 0 -35 v -18 m -5 7 l 5 -7 l 5 7"/></g><text x="540" y="251" font-size="14" fill="#52635e">Fly facing 90° right</text><circle cx="540.00" cy="307.00" r="9" fill="#b8c9bf"/><circle cx="562.20" cy="311.41" r="9" fill="#b8c9bf"/><circle cx="581.01" cy="323.99" r="9" fill="#b8c9bf"/><circle cx="593.59" cy="342.80" r="9" fill="#cba86a"/><circle cx="598.00" cy="365.00" r="9" fill="#e2a03d"/><circle cx="593.59" cy="387.20" r="9" fill="#cba86a"/><circle cx="581.01" cy="406.01" r="9" fill="#b8c9bf"/><circle cx="562.20" cy="418.59" r="9" fill="#b8c9bf"/><circle cx="540.00" cy="423.00" r="9" fill="#b8c9bf"/><circle cx="517.80" cy="418.59" r="9" fill="#b8c9bf"/><circle cx="498.99" cy="406.01" r="9" fill="#b8c9bf"/><circle cx="486.41" cy="387.20" r="9" fill="#b8c9bf"/><circle cx="482.00" cy="365.00" r="9" fill="#b8c9bf"/><circle cx="486.41" cy="342.80" r="9" fill="#b8c9bf"/><circle cx="498.99" cy="323.99" r="9" fill="#b8c9bf"/><circle cx="517.80" cy="311.41" r="9" fill="#b8c9bf"/><text x="540" y="361" font-size="15">Heading</text><text x="540" y="383" font-size="20" font-weight="bold">90°</text><text x="540" y="458" font-size="15">Activity bump moves</text></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#182a28"><text x="900" y="35" font-size="18" font-weight="bold">3. STOP IN DARKNESS</text><text x="900" y="61" font-size="15">Hold heading; drift can build up</text><rect x="750" y="82" width="300" height="185" rx="10" fill="#243c43"/><path d="M 785 120 l 16 -28 l 16 28 z" fill="#52635e"/><text x="845" y="110" font-size="13" fill="#d2dfdf">no visual cue</text><g transform="translate(900,180) rotate(90)" stroke="#d2dfdf" fill="none" stroke-width="2"><ellipse cx="-14" cy="4" rx="11" ry="24" transform="rotate(25)"/><ellipse cx="14" cy="4" rx="11" ry="24" transform="rotate(-25)"/><ellipse cy="5" rx="7" ry="23"/><circle cy="-23" r="8"/><path d="M 0 -35 v -18 m -5 7 l 5 -7 l 5 7"/></g><text x="900" y="251" font-size="14" fill="#d2dfdf">Fly facing 90° right</text><circle cx="900.00" cy="307.00" r="9" fill="#b8c9bf"/><circle cx="922.20" cy="311.41" r="9" fill="#b8c9bf"/><circle cx="941.01" cy="323.99" r="9" fill="#b8c9bf"/><circle cx="953.59" cy="342.80" r="9" fill="#cba86a"/><circle cx="958.00" cy="365.00" r="9" fill="#e2a03d"/><circle cx="953.59" cy="387.20" r="9" fill="#cba86a"/><circle cx="941.01" cy="406.01" r="9" fill="#b8c9bf"/><circle cx="922.20" cy="418.59" r="9" fill="#b8c9bf"/><circle cx="900.00" cy="423.00" r="9" fill="#b8c9bf"/><circle cx="877.80" cy="418.59" r="9" fill="#b8c9bf"/><circle cx="858.99" cy="406.01" r="9" fill="#b8c9bf"/><circle cx="846.41" cy="387.20" r="9" fill="#b8c9bf"/><circle cx="842.00" cy="365.00" r="9" fill="#b8c9bf"/><circle cx="846.41" cy="342.80" r="9" fill="#b8c9bf"/><circle cx="858.99" cy="323.99" r="9" fill="#b8c9bf"/><circle cx="877.80" cy="311.41" r="9" fill="#b8c9bf"/><text x="900" y="361" font-size="15">Heading</text><text x="900" y="383" font-size="20" font-weight="bold">90°</text><text x="900" y="458" font-size="15">Activity bump holds</text></g><text x="540" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52635e">Conceptual activity map, not anatomy. Gold = most active neurons. Zero is an arbitrary learned reference.</text></svg>